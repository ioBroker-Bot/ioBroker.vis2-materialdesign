name: Test and Release

on:
  push:
    branches:
      - master
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-**
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: 24.x
          lint: true

  adapter-tests:
    needs: check-and-lint
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # The bundle takes React from vis-2 as a shared singleton: React 18 in vis-2 2.15, React 19 from
  # the next release on (ioBroker.vis-2#689). The tests above run on React 18; this job on React 19.
  widgets-react-19:
    needs: check-and-lint
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm install --no-save react@19 react-dom@19
      - run: npm run test:widgets

  # `widgets/` and `admin/assets/` are checked-in build artifacts — they are what the package ships,
  # and nothing above rebuilds them. Without this job a commit that changes a widget source but
  # forgets the rebuild passes every check and releases the previous bundle.
  build-is-current:
    needs: check-and-lint
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx tsc -p src-widgets-ts/tsconfig.json --noEmit
      - run: npm run build
      # src-widgets-ts/src/generated is in the list because the build regenerates it too
      # (gen-group-labels.cjs, from admin/i18n) and it is committed as a source file.
      - name: committed build output must match the sources
        run: |
          git diff --exit-code -- widgets admin src-widgets-ts/src/generated \
            || { echo "::error::committed build output is stale — run 'npm run build' and commit the result"; exit 1; }
      # After the build, not before: the dual-node_modules version check reads
      # src-widgets-ts/node_modules, which only exists once the build has installed it.
      - run: npm run test:pr-gate

  deploy:
    needs: [check-and-lint, adapter-tests, widgets-react-19, build-is-current]
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: 24.x
          github-token: ${{ secrets.GITHUB_TOKEN }}
